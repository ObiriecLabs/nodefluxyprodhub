name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es: 1.2)'
        required: true

jobs:
  build-windows:
    name: Build NODEFLUXYPRODHUB.exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4.2.2
        with:
          repository: ObiriecLabs/nodefluxyprodhub-backup
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build exe con PyInstaller
        run: |
          python -m PyInstaller NODEFLUXYPRODHUB.spec --noconfirm --clean

      - name: Crea pacchetto
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $src = "dist\NODEFLUXYPRODHUB"
          if (-not (Test-Path $src)) {
            Write-Error "PyInstaller output not found: $src"; Get-ChildItem -Recurse -Depth 2 | Select-Object FullName; exit 1
          }
          Compress-Archive -Path "$src\*" -DestinationPath "NODEFLUXYPRODHUB-${ver}-win.zip"
          Rename-Item "NODEFLUXYPRODHUB-${ver}-win.zip" "NODEFLUXYPRODHUB-${ver}-Setup.exe"

      - name: Upload su Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ver="${{ github.event.inputs.version }}"
          tag="v${ver}"
          repo="ObiriecLabs/nodefluxyprodhub"
          asset="NODEFLUXYPRODHUB-${ver}-Setup.exe"
          cp "$asset" "NODEFLUXYPRODHUB-Setup.exe"
          if gh release view "$tag" --repo "$repo" &>/dev/null; then
            gh release upload "$tag" --repo "$repo" --clobber "$asset" "NODEFLUXYPRODHUB-Setup.exe"
          else
            gh release create "$tag" --repo "$repo" --title "NODEFLUXY PRODHUB ${tag}" --notes "Windows build" "$asset" "NODEFLUXYPRODHUB-Setup.exe"
          fi
